# Phase 0 deploy: free plan, SQLite Durable Object. No payment side and no rate source are connected.
name = "moneypenny"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = false

[[routes]]
pattern = "moneypenny.corporatetambola.com"
custom_domain = true

[vars]
# Phase 0 has no money flowing (no rail), so the Hub global switch is optional for now. Set MNP_STATUS_URL and remove this before a rail is connected.
MNP_STATUS_OPTIONAL = "1"

[[durable_objects.bindings]]
name = "MNP"
class_name = "MoneypennyDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MoneypennyDO"]

# MNP_MASTER_SECRET is a secret: set it with `wrangler secret put` later, never in this file.
# MNP_STATUS_URL: the Hub status.json address (plain variable). MNP_STATUS_OPTIONAL=1 only if a global switch is deliberately not used.
